; Télécommande WiFi pour poêle MCZ - Wemos D1 mini + shield RFM69 ch2i
;
;   pio run -t upload       compile et téléverse le firmware
;   pio run -t uploadfs     téléverse l'interface web (dossier data/)
;   pio device monitor      console série

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266 @ 4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.12.3
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
; conserve les réglages du module lors de "pio run -t uploadfs"
extra_scripts = post:tools/fs_keep_settings.py
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 921600

; Mise à jour par le réseau une fois le module installé :
;   pio run -e ota -t upload
[env:ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = poele-mcz.local  ; nom d'hôte réglé dans l'interface
